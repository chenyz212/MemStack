name: 发布 Windows 应用

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建并发布 Windows 应用
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: memory-desktop-web/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 安装前端依赖
        working-directory: memory-desktop-web
        run: npm ci

      - name: 检查 Rust 格式
        run: cargo fmt --all -- --check

      - name: 检查 Rust 代码
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 运行 Rust 测试
        # DPAPI 黄金密文绑定生成它的 Windows 用户与机器，GitHub 临时构建机无法解密。
        run: cargo test --workspace -- --skip decrypts_csharp_dpapi_golden_data

      - name: 运行前端测试
        working-directory: memory-desktop-web
        run: npm test

      - name: 构建前端
        working-directory: memory-desktop-web
        run: npm run build

      - name: 构建 MCP 程序
        run: cargo build --release -p memstack-mcp-stdio

      - name: 构建 Windows 安装包
        run: .\memory-desktop-web\node_modules\.bin\tauri.cmd build

      - name: 整理绿色版
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\package-portable.ps1 -Version $version
          Compress-Archive -Path ".\MemStack-Portable-$version\*" -DestinationPath ".\MemStack-Portable-$version.zip" -CompressionLevel Optimal

      - name: 生成发布文件校验值
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $installer = Get-ChildItem ".\target\release\bundle\nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "未找到 NSIS 安装包"
          }
          $portable = Get-Item ".\MemStack-Portable-$version.zip"
          $installerLine = "{0}  {1}" -f (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower(), $installer.Name
          $portableLine = "{0}  {1}" -f (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLower(), $portable.Name
          @($installerLine, $portableLine) | Set-Content ".\SHA256SUMS.txt" -Encoding utf8

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*-setup.exe
            MemStack-Portable-*.zip
            SHA256SUMS.txt
